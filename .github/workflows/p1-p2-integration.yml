name: P1-P2 integration tests
on:
  push:
    branches:
      - 'audit/**'
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install -r backend/requirements.lock.txt
      - name: Verify package
        run: python -m pip check
      - name: Unit and integration tests
        run: python -m pytest backend/tests -q
      - name: Migration upgrade on new SQLite database
        env:
          DATABASE_URL: sqlite:///./ci_alinia.db
        run: python -m alembic -c backend/alembic.ini upgrade head
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
